openapi: 3.0.0
info:
  title: Users API
  version: 1.0.0
  description: API for managing user data

servers:
  - url: https://67adef339e85da2f020bc5ea.mockapi.io/test-api
    description: Mock API server

paths:
  /users:
    get:
      summary: Get all users
      operationId: getUsers
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      summary: Create a new user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/{id}:
    get:
      summary: Get user by ID
      operationId: getUserById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: User ID
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        name:
          type: string
        avatar:
          type: string
          format: uri
      required:
        - id
        - createdAt
        - name
        - avatar

    UserInput:
      type: object
      properties:
        name:
          type: string
        avatar:
          type: string
          format: uri
      required:
        - name